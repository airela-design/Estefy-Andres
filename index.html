<html lang="es">

<head>

>

<meta name="theme-color" content="#f7f1e8">

<title>Estefy & Andrés | 09 SEP 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link

<link

  rel="stylesheet"

<style>

/* =========================================
   PALETA
========================================= */

:root{

  --burgundy:#681725;
  --burgundy-dark:#4b0d18;

  --cream:#f7f1e8;
  --paper:#fffaf3;

  --gold-light:#e5c77e;
  --gold:#c49a52;
  --gold-dark:#906322;

}


/* =========================================
   GENERAL
========================================= */

*{
  box-sizing:border-box;
}


html{
  scroll-behavior:smooth;
}


body{

  margin:0;

  min-height:100vh;

  background:var(--cream);

  color:var(--burgundy);

  font-family:
    "Bodoni Moda",
    serif;

}


/* =========================================
   MONOGRAMA E & A
   SOLO PARA EL SELLO
========================================= */

.monogram{

  display:flex;

  align-items:center;
  justify-content:center;

  color:var(--burgundy);

  white-space:nowrap;

}


.monogram .letter{

  font-family:
    "Pinyon Script",
    cursive;

  font-weight:400;

  line-height:.8;

}


.monogram .ampersand{

  font-family:
    "Bodoni Moda",
    serif;

  font-style:italic;

  font-weight:400;

  line-height:1;

  margin:0 .13em;

}


/* =========================================
   PANTALLA INICIAL
========================================= */

.intro{

  position:fixed;

  inset:0;

  width:100%;
  height:100svh;

  display:flex;

  align-items:center;
  justify-content:center;

  z-index:100;

  background:

    radial-gradient(
      circle at center,
      #fffaf4 0%,
      #f7f1e8 62%,
      #eee4d8 100%
    );

  transition:

    opacity 1s ease,
    visibility 1s ease;

}


.intro.hide{

  opacity:0;

  visibility:hidden;

  pointer-events:none;

}


.intro-content{

  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

}


/* TEXTO SOBRE EL SOBRE */

.invitation-for-you{

  margin-bottom:38px;

  font-family:
    "Montserrat",
    sans-serif;

  font-size:9px;

  font-weight:300;

  letter-spacing:4px;

  text-transform:uppercase;

  color:
    rgba(
      104,
      23,
      37,
      .65
    );

}


/* =========================================
   SOBRE
========================================= */

.envelope-wrapper{

  position:relative;

  width:
    min(
      430px,
      86vw
    );

  perspective:1500px;

  cursor:pointer;

  outline:none;

}


.envelope{

  position:relative;

  width:100%;

  aspect-ratio:
    1.42 / 1;

  filter:

    drop-shadow(
      0 24px 26px
      rgba(76,19,31,.17)
    );

}


/* PARTE TRASERA */

.envelope-back{

  position:absolute;

  inset:0;

  overflow:hidden;

  border-radius:4px;

  background:

    linear-gradient(
      145deg,
      #fffaf3,
      #eee3d6
    );

}


/* INTERIOR BURGUNDY */

.envelope-liner{

  position:absolute;

  top:0;

  left:7px;
  right:7px;

  height:74%;

  background:

    linear-gradient(
      160deg,
      #791d30 0%,
      #681725 50%,
      #4d0d19 100%
    );

  clip-path:

    polygon(
      0 0,
      100% 0,
      50% 100%
    );

}


/* =========================================
   TARJETA DENTRO DEL SOBRE
========================================= */

.preview-card{

  position:absolute;

  z-index:3;

  width:84%;
  height:88%;

  left:8%;
  top:8%;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  background:var(--paper);

  border:

    1px solid
    rgba(
      104,
      23,
      37,
      .25
    );

  transition:

    transform
    1.5s
    cubic-bezier(
      .16,
      .83,
      .28,
      1
    );

}


/* DOBLE BORDE DE LA TARJETA */

.preview-card::after{

  content:"";

  position:absolute;

  inset:8px;

  border:

    1px solid
    rgba(
      104,
      23,
      37,
      .72
    );

}


/* NOMBRES EN TARJETA QUE SALE */

.preview-names{

  position:relative;

  z-index:2;

  display:flex;

  flex-direction:column;

  align-items:center;

  color:var(--burgundy);

}


.preview-name{

  font-family:
    "Bodoni Moda",
    serif;

  font-size:32px;

  line-height:.9;

}


.preview-slash{

  font-family:
    "Pinyon Script",
    cursive;

  font-size:30px;

  line-height:.8;

  margin:7px 0;

}


/* =========================================
   FRENTE DEL SOBRE
========================================= */

.envelope-front{

  position:absolute;

  inset:0;

  z-index:5;

  background:

    linear-gradient(
      145deg,
      #fffaf3,
      #eee3d7
    );

  clip-path:

    polygon(
      0 26%,
      50% 69%,
      100% 26%,
      100% 100%,
      0 100%
    );

}


/* =========================================
   SOLAPA
========================================= */

.flap{

  position:absolute;

  width:100%;
  height:66%;

  top:0;
  left:0;

  z-index:7;

  transform-origin:
    top center;

  transform-style:
    preserve-3d;

  transition:

    transform
    1.05s
    cubic-bezier(
      .2,
      .75,
      .25,
      1
    );

}


/* PARTE EXTERIOR */

.flap-front{

  position:absolute;

  inset:0;

  background:

    linear-gradient(
      180deg,
      #fffaf3,
      #eee3d7
    );

  clip-path:

    polygon(
      0 0,
      100% 0,
      50% 100%
    );

  backface-visibility:hidden;

}


/* INTERIOR BURGUNDY */

.flap-back{

  position:absolute;

  inset:0;

  background:

    linear-gradient(
      160deg,
      #791d30,
      #51101c
    );

  clip-path:

    polygon(
      0 0,
      100% 0,
      50% 100%
    );

  transform:
    rotateX(180deg);

  backface-visibility:hidden;

}


/* =========================================
   SELLO DORADO
========================================= */

.seal{

  position:absolute;

  z-index:10;

  width:76px;
  height:76px;

  left:50%;
  top:51%;

  transform:
    translate(-50%,-50%);

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:

    47% 53% 45% 55%
    /
    54% 44% 56% 46%;

  background:

    radial-gradient(
      circle at 35% 28%,
      var(--gold-light),
      transparent 14%
    ),

    radial-gradient(
      circle,
      #d1aa61,
      var(--gold) 60%,
      var(--gold-dark)
    );

  box-shadow:

    0 5px 12px
    rgba(48,27,5,.32),

    inset
    0 0 0 3px
    rgba(255,238,185,.30);

  transition:

    opacity .4s ease,
    transform .45s ease;

}


.seal::before{

  content:"";

  position:absolute;

  inset:9px;

  border:

    1px solid
    rgba(
      100,
      63,
      20,
      .58
    );

  border-radius:50%;

}


/* E&A DEL SELLO */

.seal-monogram{

  position:relative;

  z-index:2;

  color:#714a18;

}


.seal-monogram .letter{

  font-size:29px;

}


.seal-monogram .ampersand{

  font-size:11px;

  margin:0 2px;

  color:#714a18;

}


/* =========================================
   TOCA PARA ABRIR
========================================= */

.open-text{

  margin-top:31px;

  text-align:center;

  font-family:
    "Montserrat",
    sans-serif;

  font-size:9px;

  font-weight:300;

  text-transform:uppercase;

  letter-spacing:3.5px;

  color:
    rgba(
      104,
      23,
      37,
      .62
    );

  animation:
    pulse 2.2s infinite;

}


@keyframes pulse{

  0%,
  100%{

    opacity:.42;

  }

  50%{

    opacity:1;

  }

}


/* =========================================
   ANIMACIÓN DEL SOBRE
========================================= */

.envelope-wrapper.open
.seal{

  opacity:0;

  transform:

    translate(
      -50%,
      -50%
    )

    scale(.6);

}


.envelope-wrapper.open
.flap{

  transform:
    rotateX(180deg);

  z-index:1;

}


.envelope-wrapper.open
.preview-card{

  transform:
    translateY(-73%);

}


/* =========================================
   INVITACIÓN ABIERTA
========================================= */

.invitation{

  min-height:100svh;

  padding:

    20px 14px
    60px;

  display:flex;

  justify-content:center;

  background:

    radial-gradient(
      circle at top,
      #fffdf9,
      var(--cream)
    );

}


/* PAPEL */

.paper{

  width:
    min(
      710px,
      100%
    );

  padding:9px;

  background:var(--paper);

  box-shadow:

    0 22px 60px
    rgba(
      83,
      18,
      31,
      .09
    );

}


/* =========================================
   DOBLE MARCO
========================================= */

.paper-border{

  position:relative;

  min-height:96svh;

  border:

    1px solid
    var(--burgundy);

  padding:

    72px 34px
    55px;

}


.paper-border::before{

  content:"";

  position:absolute;

  inset:7px;

  border:

    1px solid
    rgba(
      104,
      23,
      37,
      .84
    );

  pointer-events:none;

}


/* =========================================
   FECHA SUPERIOR
========================================= */

.wedding-date{

  position:relative;

  z-index:2;

  text-align:center;

  font-family:
    "Montserrat",
    sans-serif;

  font-size:10px;

  font-weight:300;

  letter-spacing:4.5px;

  text-transform:uppercase;

  margin-bottom:65px;

}


/* =========================================
   ESTEFY / ANDRÉS
========================================= */

.couple-names{

  position:relative;

  z-index:2;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  color:var(--burgundy);

  margin:

    0 auto
    68px;

}


/* NOMBRES */

.bride-name,
.groom-name{

  font-family:
    "Bodoni Moda",
    serif;

  font-size:

    clamp(
      65px,
      13vw,
      106px
    );

  font-weight:400;

  line-height:.88;

  letter-spacing:-4px;

}


/* / CENTRAL */

.name-divider{

  font-family:
    "Pinyon Script",
    cursive;

  font-size:

    clamp(
      54px,
      10vw,
      78px
    );

  font-weight:400;

  line-height:.65;

  margin:

    24px 0
    20px;

  transform:
    rotate(-8deg);

}


/* =========================================
   OTAVALO
========================================= */

.city{

  position:relative;

  z-index:2;

  text-align:center;

  font-family:
    "Montserrat",
    sans-serif;

  font-size:9px;

  font-weight:300;

  letter-spacing:4px;

  text-transform:uppercase;

  margin-bottom:42px;

}


/* =========================================
   FRASE
========================================= */

.phrase{

  position:relative;

  z-index:2;

  width:
    min(
      390px,
      90%
    );

  margin:

    0 auto
    36px;

  text-align:center;

  font-family:
    "Bodoni Moda",
    serif;

  font-size:17px;

  font-style:italic;

  line-height:1.65;

}


/* DIVISOR */

.divider{

  position:relative;

  z-index:2;

  width:48px;

  height:1px;

  margin:

    0 auto
    37px;

  background:
    var(--burgundy);

  opacity:.45;

}


/* =========================================
   INFORMACIÓN
========================================= */

.details{

  position:relative;

  z-index:2;

  max-width:430px;

  margin:auto;

}


.event{

  text-align:center;

  padding:

    15px 5px
    23px;

}


/* HORA */

.time{

  margin-bottom:9px;

  font-family:
    "Montserrat",
    sans-serif;

  font-size:9px;

  font-weight:400;

  letter-spacing:3px;

}


/* LUGAR */

.place{

  font-family:
    "Bodoni Moda",
    serif;

  font-size:22px;

  font-weight:400;

}


.place a{

  color:
    var(--burgundy);

  text-decoration:none;

  border-bottom:

    1px solid
    rgba(
      104,
      23,
      37,
      .35
    );

  padding-bottom:2px;

}


/* TEXTO VER UBICACIÓN */

.map-text{

  margin-top:9px;

  font-family:
    "Montserrat",
    sans-serif;

  font-size:7px;

  font-weight:300;

  letter-spacing:2px;

  text-transform:uppercase;

  opacity:.5;

}


/* =========================================
   CONFIRMACIÓN
========================================= */

.rsvp{

  position:relative;

  z-index:2;

  text-align:center;

  margin-top:38px;

}


.rsvp-button{

  display:inline-block;

  padding:

    15px 29px;

  background:
    var(--burgundy);

  color:
    var(--paper);

  border:

    1px solid
    var(--burgundy);

  text-decoration:none;

  font-family:
    "Montserrat",
    sans-serif;

  font-size:9px;

  font-weight:300;

  letter-spacing:2.3px;

  text-transform:uppercase;

  transition:

    background .3s ease,
    color .3s ease;

}


.rsvp-button:hover{

  background:
    transparent;

  color:
    var(--burgundy);

}


/* =========================================
   DETALLE FINAL
========================================= */

.final-detail{

  position:relative;

  z-index:2;

  text-align:center;

  margin-top:47px;

  font-family:
    "Pinyon Script",
    cursive;

  font-size:38px;

  color:
    var(--burgundy);

}


/* =========================================
   CELULAR
========================================= */

@media(max-width:520px){


  .paper{

    padding:7px;

  }


  .paper-border{

    padding:

      52px 20px
      42px;

  }


  .wedding-date{

    margin-bottom:55px;

  }


  .couple-names{

    margin-bottom:58px;

  }


  .bride-name,
  .groom-name{

    letter-spacing:-2px;

  }


  .phrase{

    font-size:16px;

  }


  .place{

    font-size:20px;

  }


  .seal{

    width:70px;

    height:70px;

  }

}


/* =========================================
   REDUCIR MOVIMIENTO
========================================= */

@media(prefers-reduced-motion:reduce){

  *{

    animation:none !important;

    transition:none !important;

  }

}

</style>

</head>


<body>


<!-- =========================================
     PANTALLA DEL SOBRE
========================================= -->

<section
  class="intro"
  id="intro"
>


<div class="intro-content">


  <div class="invitation-for-you">

    Una invitación para ti

  </div>



  <div
    class="envelope-wrapper"
    id="envelope"
    role="button"
    tabindex="0"
    aria-label="Toca para abrir la invitación"
  >


    <div class="envelope">


      <!-- PARTE TRASERA -->

      <div class="envelope-back">

        <div class="envelope-liner"></div>

      </div>



      <!-- TARJETA QUE SALE -->

      <div class="preview-card">


        <div class="preview-names">


          <span class="preview-name">

            Estefy

          </span>


          <span class="preview-slash">

            /

          </span>


          <span class="preview-name">

            Andrés

          </span>


        </div>


      </div>



      <!-- FRENTE DEL SOBRE -->

      <div class="envelope-front"></div>



      <!-- SOLAPA -->

      <div class="flap">


        <div class="flap-front"></div>


        <div class="flap-back"></div>


      </div>



      <!-- SELLO -->

      <div class="seal">


        <div class="monogram seal-monogram">


          <span class="letter">

            E

          </span>


          <span class="ampersand">

            &amp;

          </span>


          <span class="letter">

            A

          </span>


        </div>


      </div>


    </div>



    <div class="open-text">

      Toca para abrir

    </div>


  </div>


</div>


</section>




<!-- =========================================
     INVITACIÓN PRINCIPAL
========================================= -->

<main class="invitation">


<section class="paper">


<div class="paper-border">



  <!-- FECHA -->

  <div class="wedding-date">

    09 · SEP · 2026

  </div>



  <!-- NOMBRES -->

  <div class="couple-names">


    <span class="bride-name">

      Estefy

    </span>


    <span class="name-divider">

      /

    </span>


    <span class="groom-name">

      Andrés

    </span>


  </div>



  <!-- CIUDAD -->

  <div class="city">

    OTAVALO

  </div>



  <!-- FRASE -->

  <p class="phrase">

    Nos hará mucha ilusión
    compartir este día contigo.

  </p>



  <div class="divider"></div>



  <!-- INFORMACIÓN DEL EVENTO -->

  <div class="details">



    <div class="event">


      <div class="time">

        15H00

      </div>


      <div class="place">

        Registro Civil · Otavalo

      </div>


    </div>



    <div class="event">


      <div class="time">

        16H30

      </div>


      <div class="place">


        <a
          href="https://maps.google.com/?q=0.256863,-78.241318"
          target="_blank"
          rel="noopener"
        >

          Peguche

        </a>


      </div>


      <div class="map-text">

        Toca para ver la ubicación

      </div>


    </div>


  </div>



  <!-- CONFIRMAR ASISTENCIA -->

  <div class="rsvp">


    <a
      class="rsvp-button"

      href="https://wa.me/593984276163?text=Hola%2C%20confirmo%20mi%20asistencia%20a%20la%20boda%20de%20Estefy%20%26%20Andr%C3%A9s.%0A%0AMi%20nombre%20es%3A%20"

      target="_blank"

      rel="noopener"
    >

      Confirma tu asistencia

    </a>


  </div>



  <!-- DETALLE FINAL -->

  <div class="final-detail">

    E &amp; A

  </div>


</div>


</section>


</main>




<script>


const envelope =
  document.getElementById(
    "envelope"
  );


const intro =
  document.getElementById(
    "intro"
  );


let opened = false;



function openInvitation(){


  if(opened){

    return;

  }


  opened = true;



  /* ABRIR SOBRE */

  envelope.classList.add(
    "open"
  );



  /*
     Espera para que primero se vea:
     - desaparecer el sello
     - abrir la solapa
     - interior burgundy
     - salir la tarjeta
  */

  setTimeout(
    () => {


      intro.classList.add(
        "hide"
      );


    },
    2300
  );


}



/* CLICK / TOUCH */

envelope.addEventListener(
  "click",
  openInvitation
);



/* ENTER / ESPACIO */

envelope.addEventListener(
  "keydown",
  event => {


    if(
      event.key === "Enter"
      ||
      event.key === " "
    ){


      event.preventDefault();


      openInvitation();


    }


  }
);


</script>
